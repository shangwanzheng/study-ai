name: Daily commit

on:
  schedule:
    # Asia/Shanghai 每天 00:00 = UTC 16:00
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write journal and commit
        env:
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          DATE="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          mkdir -p journal
          FILE="journal/${DATE}.md"
          {
            echo "# ${DATE}"
            echo ""
            echo "自动打卡"
          } > "${FILE}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${FILE}"
          if git diff --cached --quiet; then
            echo "No changes for ${DATE}; skip commit."
            exit 0
          fi

          git commit -m "chore: daily check-in ${DATE}"
          git push origin HEAD:main
